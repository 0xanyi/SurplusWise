name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include real financial data,
        access tokens, or database credentials in this issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image tag, or commit SHA
      placeholder: v0.9.2
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Sika?
      options:
        - Docker Compose
        - Prebuilt container image
        - Local dev (npm run dev)
        - Dokploy
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Container or browser console output. Redact secrets.
      render: shell
