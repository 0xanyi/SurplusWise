version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep the React/Next and Radix trees together; splitting them across
      # PRs produces peer-dependency conflicts that cannot merge individually.
      next-react:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "react-is"
          - "@types/react"
          - "@types/react-dom"
      radix:
        patterns:
          - "@radix-ui/*"
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "@typescript-eslint/*"
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # @types/node must track the Node runtime major (see .nvmrc / Dockerfile),
      # not the latest published major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The Node base image must stay on the Active LTS line and stay in step
      # with engines, .nvmrc, and @types/node. A major bump here passes CI
      # (npm does not enforce engines) while silently moving the runtime off
      # LTS, so it is a deliberate four-file change, not an automated one.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
